<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLOQ</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0A0A0D">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#FAF7EE;--sf:#fff;--tx:#1B1A16;--mu:#6B6658;--ac:#8A6A00;--on:#fff;--me:#F1E2A8;--th:#ECE8DB;--ln:#E2DCC8;--ok:#1d6fd6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0A0A0D;--sf:#15151A;--tx:#EDE8D8;--mu:#A8A292;--ac:#D4AF37;--on:#1A1400;--me:#3A2F0F;--th:#1E1E24;--ln:#2A2A31;--ok:#5AA2FF}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);background:var(--sf)}
.hd .t{flex:1;font-weight:600}.logo{font:700 24px Georgia,serif;letter-spacing:.1em;color:var(--ac);flex:1}
.ib{width:40px;height:40px;border-radius:50%;font-size:18px}.ib.acc{color:var(--ac)}
.body{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--ln)}
.row .m{flex:1;min-width:0}.row b{display:block}.row small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.rt small{color:var(--mu);font-size:12px}
.av{border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none;object-fit:cover;width:46px;height:46px}
.bd{background:var(--ac);color:var(--on);border-radius:10px;padding:1px 7px;font-size:12px}
.nav{display:flex;border-top:1px solid var(--ln);background:var(--sf)}.nav button{flex:1;padding:12px;color:var(--mu)}.nav .on{color:var(--ac);font-weight:700}
.card{margin:12px 16px;padding:16px;background:var(--sf);border:1px solid var(--ln);border-radius:14px}
.pb{background:var(--ac);color:var(--on);border-radius:12px;padding:10px 18px;font-weight:600}.pb.o{background:none;color:var(--ac);border:1px solid var(--ac)}
.w{display:block;width:calc(100% - 32px);margin:8px 16px;box-sizing:border-box}.w0{display:block;width:100%}
input.f{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);margin:6px 0}
.sq{width:calc(100% - 32px);margin:8px 16px}
.chips{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto}
.fc{padding:6px 14px;border-radius:20px;border:1px solid var(--ln);white-space:nowrap;background:var(--sf)}.fc.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.fab{position:absolute;right:18px;bottom:70px;width:56px;height:56px;border-radius:18px;background:var(--ac);color:var(--on);font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.cinfo{text-align:center;padding:8px 0 6px;border-bottom:1px solid var(--ln)}.cinfo .av{margin:0 auto}.cinfo small{display:block;color:var(--mu);margin-top:4px;min-height:16px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--th);align-self:flex-start;text-align:left;word-break:break-word}
.b.me{background:var(--me);align-self:flex-end}.b small{display:block;text-align:right;color:var(--mu);font-size:11px}
.tk{margin-left:4px}.tk.seen{color:var(--ok)}
.cb{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--ln);background:var(--sf);align-items:center}
.cb input{flex:1;min-width:0;padding:10px 14px;border-radius:22px;border:1px solid var(--ln);background:var(--bg)}
.ov{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;overflow-y:auto}
.ov .f{max-width:340px}.ov .pb{max-width:340px}
.seg{display:flex;border:1px solid var(--ln);border-radius:12px;overflow:hidden;width:100%;max-width:340px}.seg button{flex:1;padding:10px}.seg .on{background:var(--ac);color:var(--on);font-weight:700}
.err{color:#D33;min-height:20px;margin:0;font-size:14px}.mu{color:var(--mu);font-size:14px;margin:4px 0}.pad{padding:0 16px}.empty{padding:24px;text-align:center;color:var(--mu)}
.lnk{color:var(--ac);text-decoration:underline}.center{text-align:center;padding:20px 0 4px}.center .av{margin:0 auto 8px}
.row2{display:flex;justify-content:space-between;align-items:center}
.sw{width:46px;height:26px;border-radius:13px;background:var(--th);position:relative;border:1px solid var(--ln)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.2s}
.sw.on{background:var(--ac)}.sw.on::after{left:22px;background:var(--on)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:6}
.sh{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--sf);border-top:1px solid var(--ln);border-radius:18px 18px 0 0;padding:14px 16px 22px;text-align:center}
.sh button{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--ln)}.sh .av{margin:0 auto 8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:.2s;z-index:9;max-width:90%;text-align:center;pointer-events:none}
h1,h2{margin:0}
</style></head><body>
<div id="app"></div><div id="toast" role="status"></div><input type="file" id="pf" accept="image/*" hidden>

function beep(){if(!S.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;[880,1175].forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.18);t+=.18})}catch(e){}}
const fmtT=ms=>new Date(ms).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const fmtD=ms=>{const d=new Date(ms),n=new Date();return d.toDateString()===n.toDateString()?'today '+fmtT(ms):d.toLocaleDateString([],{day:'numeric',month:'short'})+' '+fmtT(ms)};
const otherOf=c=>c.members.find(m=>m!==S.me.uid);
const cidOf=(a,b)=>[a,b].sort().join('_');
const av=(u,s=46)=>u&&u.photo?`<img class="av" src="${esc(u.photo)}" alt="" style="width:${s}px;height:${s}px">`:`<div class="av" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.4)}px">${esc(((u&&u.name)||'?')[0].toUpperCase())}</div>`;
const tick=(c,m)=>{const o=otherOf(c),sn=(c.seen||{})[o]||0,dl=(c.deliv||{})[o]||0;return m.at<=sn?'seen':m.at<=dl?'deliv':'sent'};
const tickH=s=>`<span class="tk ${s==='seen'?'seen':''}">${s==='sent'?'✓':'✓✓'}</span>`;

async function ensureUser(u,name){const r=doc(db,'users',u.uid),s=await getDoc(r);if(!s.exists())await setDoc(r,{name:name||u.displayName||(u.email||'User').split('@')[0],email:(u.email||'').toLowerCase(),photo:'',ls:'everyone',createdAt:Date.now(),lastSeen:Date.now(),online:true})}
function loadUser(uid){if(S.U[uid]||pend[uid])return;pend[uid]=1;getDoc(doc(db,'users',uid)).then(s=>{S.U[uid]=s.data()||{name:'Unknown'};upList()}).catch(()=>{delete pend[uid]})}
function presence(on){if(!S.me)return;setDoc(doc(db,'users',S.me.uid),{online:on,lastSeen:Date.now()},{merge:true}).catch(()=>{})}
setInterval(()=>{if(S.me&&document.visibilityState==='visible')presence(true)},40000);

const homeV=()=>`<div class="hd"><img src="${LOGO}" height="30" alt=""><b class="logo">CLOQ</b></div><div class="body"><input class="f sq" id="sq" placeholder="Search chats" value="${esc(S.q)}" aria-label="Search chats"><div class="chips">${[['all','All'],['unread','● Unread'],['fav','★ Favourites']].map(x=>`<button class="fc ${S.flt===x[0]?'on':''}" data-a="flt" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><div id="list"></div></div><button class="fab" data-a="newchat" aria-label="New chat">＋</button>${nav('home')}`;
function listH(){const me=S.me.uid;const l=S.chats.filter(c=>{const o=S.U[otherOf(c)],n=((o&&o.name)||'').toLowerCase();if(S.q&&!n.includes(S.q.toLowerCase()))return false;if(S.flt==='unread')return ((c.unread||{})[me]||0)>0;if(S.flt==='fav')return !!S.fav[c.id];return true});
 if(!l.length)return `<p class="empty">${S.chats.length?'No chats match.':'No chats yet. Tap ＋ and find a friend by email.'}</p>`;
 return l.map(c=>{const o=otherOf(c),u=S.U[o],un=(c.unread||{})[me]||0,m=c.lastMsg||{};return `<button class="row" data-a="open" data-v="${esc(c.id)}|${esc(o)}">${av(u)}<span class="m"><b>${esc((u&&u.name)||'…')}${S.fav[c.id]?' ★':''}</b><small>${m.from===me?tickH(tick(c,m))+' ':''}${esc(m.t||'')}</small></span><span class="rt"><small>${m.at?fmtT(m.at):''}</small>${un?`<span class="bd">${un}</span>`:''}</span></button>`}).join('')}

function upMsgs(){const el=$('#msgs');if(!el)return;const c=S.chats.find(x=>x.id===S.cid)||{members:[S.me.uid,S.other],seen:{},deliv:{}};
 el.innerHTML=S.msgs.map(m=>{const me=m.from===S.me.uid;return `<div class="b ${me?'me':''}" ${me?`data-a="msg" data-v="${esc(m.id)}"`:''}>${esc(m.t)}<small>${fmtT(m.at)} ${me?tickH(tick(c,m)):''}</small></div>`}).join('')||'<p class="empty">Say assalam o alaikum 👋</p>';
 el.scrollTop=el.scrollHeight;const st=$('#st');if(st)st.textContent=stText();const ct=$('#ct');if(ct)ct.textContent=(S.U[S.other]||{}).name||'…';const cv=$('#cav');if(cv)cv.innerHTML=av(S.U[S.other],44)}
const setV=()=>{const m=S.my||{};return `<div class="hd"><span class="t">Settings</span></div><div class="body"><div class="center">${av(m,96)}<button class="pb o" data-a="pickdp">📷 Change DP</button><h2 style="margin-top:8px">${esc(m.name||'')}</h2><p class="mu">${esc(m.email||'')}</p></div><div class="card"><b>Your name</b><input class="f" id="sn" value="${esc(m.name||'')}"><button class="pb" data-a="savename">Save name</button></div><div class="card"><b>Last seen and online</b><p class="mu">If you hide yours, you cannot see other people's.</p><div class="chips" style="padding:8px 0 0">${['everyone','nobody'].map(x=>`<button class="fc ${(m.ls||'everyone')===x?'on':''}" data-a="ls" data-v="${x}">${x}</button>`).join('')}</div></div><div class="card"><div class="row2"><span>Message sound</span><button class="sw ${S.snd?'on':''}" data-a="snd" role="switch" aria-checked="${S.snd}" aria-label="Message sound"></button></div></div>${deferred?'<button class="pb w" data-a="install">Install CLOQ on this phone</button>':'<p class="mu pad">To install: Chrome menu ⋮ → Add to Home screen.</p>'}<button class="pb o w" data-a="logout">Log out</button></div>${nav('set')}`};
function sheetV(){const k=S.sheet;let b='';
 if(k==='new')b=`<b>Find a friend</b><p class="mu">Type the email your friend used to sign up.</p><input class="f" id="fe" type="email" placeholder="friend@email.com" aria-label="Friend email"><p class="err">${esc(S.sm)}</p><button class="pb w0" data-a="find">Find</button>`;
 else if(k==='menu')b=`<button data-a="contact">👤 View contact</button><button data-a="fav">${S.fav[S.cid]?'☆ Remove from favourites':'★ Add to favourites'}</button>`;
 else if(k==='contact'){const o=S.U[S.other]||{};b=`${av(o,72)}<h2>${esc(o.name||'')}</h2><p class="mu">${esc(o.email||'')}</p><p>${esc(stText())}</p>`}
 else if(k==='msg')b=`<button data-a="unsend">🗑 Unsend message</button>`;
 return `<div class="scrim" data-a="close"></div><div class="sh">${b}<button data-a="close">Close</button></div>`}
function render(){const keep={};if(!noKeep)['inp','sq','fe','sn','nm','em','pw'].forEach(id=>{const e=$('#'+id);if(e)keep[id]=[e.value,document.activeElement===e]});noKeep=false;
 const V={splash:splashV,agree:agreeV,auth:authV,home:homeV,chat:chatV,set:setV}[S.scr]||homeV;
 $('#app').innerHTML=V()+(S.sheet?sheetV():'');
 for(const id in keep){const e=$('#'+id);if(e){e.value=keep[id][0];if(keep[id][1])e.focus()}}
 if(S.scr==='home')upList();if(S.scr==='chat')upMsgs()}
function route(){if(!S.ready||!S.splash)return;if(S.me){if(!['home','chat','set'].includes(S.scr))S.scr='home'}else S.scr=ls('cloq_agreed')?'auth':'agree';render()}

/* ---------- data ---------- */
function chatsSnap(snap){const me=S.me.uid;S.chats=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
 S.chats.forEach(c=>{const o=otherOf(c);loadUser(o);const m=c.lastMsg;
  if(m&&m.from!==me){
   if((c.updatedAt||0)>((c.deliv||{})[me]||0)&&delivDone[c.id]!==c.updatedAt){delivDone[c.id]=c.updatedAt;updateDoc(doc(db,'chats',c.id),{['deliv.'+me]:Math.max(Date.now(),c.updatedAt)}).catch(()=>{})}
   if((loaded||lastUpd[c.id]!==undefined)&&lastUpd[c.id]!==c.updatedAt&&!(S.scr==='chat'&&S.cid===c.id)){toast(((S.U[o]&&S.U[o].name)||'New message')+': '+m.t);beep()}}
  lastUpd[c.id]=c.updatedAt});
 loaded=true;upList();if(S.scr==='chat'){upMsgs();markSeen()}}
function markSeen(){const c=S.chats.find(x=>x.id===S.cid);if(!c||!S.me)return;const me=S.me.uid,m=c.lastMsg;if(!m||m.from===me)return;const key=c.updatedAt+'|'+((c.unread||{})[me]||0);if(seenDone[c.id]===key)return;if(((c.seen||{})[me]||0)>=c.updatedAt&&!((c.unread||{})[me]))return;seenDone[c.id]=key;updateDoc(doc(db,'chats',c.id),{['unread.'+me]:0,['seen.'+me]:Math.max(Date.now(),c.updatedAt||0)}).catch(()=>{})}
function subMsgs(){if(unsubM)unsubM();unsubM=onSnapshot(query(collection(db,'chats',S.cid,'messages'),orderBy('at')),s=>{S.msgs=s.docs.map(d=>({id:d.id,...d.data()}));upMsgs();markSeen()},e=>toast('Messages error: '+e.code))}
function openChat(id,other){if(unsubM){unsubM();unsubM=null}if(unsubO)unsubO();S.cid=id;S.other=other;S.msgs=[];S.scr='chat';S.sheet=null;noKeep=true;
 if(S.chats.some(c=>c.id===id))subMsgs();
 unsubO=onSnapshot(doc(db,'users',other),s=>{if(s.exists())S.U[other]=s.data();upMsgs()},()=>{});render();markSeen()}
async function send(){const i=$('#inp');if(!i)return;const t=i.value.trim();if(!t)return;i.value='';const me=S.me.uid,o=S.other,ref=doc(db,'chats',S.cid),now=Date.now();
 try{const exists=S.chats.some(c=>c.id===S.cid);
  await setDoc(ref,{members:[me,o],updatedAt:now,lastMsg:{t:t.slice(0,80),from:me,at:now},unread:{[o]:increment(1)}},{merge:true});
  if(!exists&&!unsubM)subMsgs();
  await addDoc(collection(ref,'messages'),{from:me,t,at:now})}catch(e){toast('Could not send ('+(e.code||e.message)+')')}}
function shrink(file,sz=96){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d'),s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,sz,sz);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=u})}
async function upd(data,msg){try{await updateDoc(doc(db,'users',S.me.uid),data);if(msg)toast(msg)}catch(e){toast('Could not save ('+(e.code||e.message)+')')}}

/* ---------- actions ---------- */
const A={
agree:()=>{ls('cloq_agreed','1');route()},
mode:v=>{S.mode=v;S.err='';render()},
auth:async()=>{const em=($('#em').value||'').trim().toLowerCase(),pw=$('#pw').value||'',nm=S.mode==='signup'?($('#nm').value||'').trim():'';S.f={em,nm};S.err='';
 try{if(S.mode==='signup'){if(!nm)throw {code:'',message:'Enter your name'};signing=true;const c=await createUserWithEmailAndPassword(auth,em,pw);await ensureUser(c.user,nm)}else await signInWithEmailAndPassword(auth,em,pw)}catch(e){S.err=e.code===''?e.message:errMsg(e)}signing=false;if(!S.me)render()},
google:async()=>{S.err='';try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){S.err=errMsg(e);render()}},
reset:async()=>{const em=($('#em').value||'').trim();if(!em){toast('Type your email first');return}try{await sendPasswordResetEmail(auth,em);toast('Password reset email sent')}catch(e){toast(errMsg(e))}},
go:v=>{S.scr=v;S.sheet=null;render()},
flt:v=>{S.flt=v;render()},
open:v=>{const p=v.split('|');openChat(p[0],p[1])},
back:()=>{if(unsubM){unsubM();unsubM=null}if(unsubO){unsubO();unsubO=null}S.cid=null;S.scr='home';S.sheet=null;render()},
send,
newchat:()=>{S.sheet='new';S.sm='';render()},
find:async()=>{const e=($('#fe').value||'').trim().toLowerCase();if(!e)return;
 if(e===((S.my&&S.my.email)||'')){S.sm='That is your own email';return render()}
 try{const s=await getDocs(query(collection(db,'users'),where('email','==',e),limit(1)));
  if(s.empty){S.sm='No CLOQ user with this email. Ask your friend to sign up first.';return render()}
  const d=s.docs[0];S.U[d.id]=d.data();S.sheet=null;openChat(cidOf(S.me.uid,d.id),d.id)}catch(x){S.sm='Search failed ('+(x.code||x.message)+')';render()}},
menu:()=>{S.sheet='menu';render()},contact:()=>{S.sheet='contact';render()},
fav:()=>{S.fav[S.cid]?delete S.fav[S.cid]:S.fav[S.cid]=1;ls('cloq_fav',JSON.stringify(S.fav));S.sheet=null;toast(S.fav[S.cid]?'Added to favourites':'Removed from favourites');render()},
msg:v=>{S.mid=v;S.sheet='msg';render()},
unsend:async()=>{S.sheet=null;render();try{await deleteDoc(doc(db,'chats',S.cid,'messages',S.mid))}catch(e){toast('Could not unsend ('+(e.code||e.message)+')')}},
close:()=>{S.sheet=null;render()},
pickdp:()=>$('#pf').click(),
savename:()=>{const n=($('#sn').value||'').trim();if(!n)return toast('Enter a name');upd({name:n},'Name saved')},
ls:v=>upd({ls:v},'Saved'),
snd:()=>{S.snd=!S.snd;ls('cloq_snd',S.snd?'1':'0');render()},
install:async()=>{if(!deferred)return;deferred.prompt();deferred=null;render()},
logout:async()=>{presence(false);try{await signOut(auth)}catch(e){}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='inp')send();if(e.target.id==='fe')A.find()}});
document.addEventListener('input',e=>{if(e.target.id==='sq'){S.q=e.target.value;upList()}});
$('#pf').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const d=await shrink(f);await upd({photo:d},'DP updated')}catch(x){toast('Could not read this photo')}});

onAuthStateChanged(auth,async u=>{
 unsubs.forEach(f=>f());unsubs=[];loaded=false;
 if(!u){S.me=null;S.my=null;S.chats=[];S.ready=true;route();return}
 S.me=u;if(!signing){try{await ensureUser(u)}catch(e){toast('Profile error ('+(e.code||e.message)+')')}}
 unsubs.push(onSnapshot(doc(db,'users',u.uid),s=>{S.my=s.data()||{};S.U[u.uid]=S.my;if(S.scr==='set')render()},()=>{}));
 unsubs.push(onSnapshot(query(collection(db,'chats'),where('members','array-contains',u.uid)),chatsSnap,e=>toast('Chats error: '+e.code)));
 presence(true);S.ready=true;route()});
render();setTimeout(()=>{S.splash=true;route()},1100);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
