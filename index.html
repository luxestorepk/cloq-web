<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLOQ</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0A0A0D">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0A0A0D;--sf:#15151A;--tx:#EDE8D8;--mu:#A8A292;--ac:#D4AF37;--on:#1A1400;--me:#3A2F0F;--th:#1E1E24;--ln:#2A2A31;--ok:#5AA2FF;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
:root[data-mode="light"]{--bg:#FAF7EE;--sf:#fff;--tx:#1B1A16;--mu:#6B6658;--me:#F1E2A8;--th:#ECE8DB;--ln:#E2DCC8;--ok:#1d6fd6}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif}
button,input{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;padding:0}
#app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln);background:var(--sf)}
.hd .t{flex:1;font-weight:600}.logo{font:700 24px Georgia,serif;letter-spacing:.1em;color:var(--ac);flex:1}
.ib{width:40px;height:40px;border-radius:50%;font-size:18px}.ib.acc{color:var(--ac)}
.body{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 16px;border-bottom:1px solid var(--ln)}
.row .m{flex:1;min-width:0}.row b{display:block}.row small{display:block;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}.rt small{color:var(--mu);font-size:12px}
.av{border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none;object-fit:cover;width:46px;height:46px}
.bd{background:var(--ac);color:var(--on);border-radius:10px;padding:1px 7px;font-size:12px}
.nav{display:flex;border-top:1px solid var(--ln);background:var(--sf)}.nav button{flex:1;padding:12px;color:var(--mu)}.nav .on{color:var(--ac);font-weight:700}
.card{margin:12px 16px;padding:16px;background:var(--sf);border:1px solid var(--ln);border-radius:14px}
.pb{background:var(--ac);color:var(--on);border-radius:12px;padding:10px 18px;font-weight:600}.pb.o{background:none;color:var(--ac);border:1px solid var(--ac)}
.w{display:block;width:calc(100% - 32px);margin:8px 16px;box-sizing:border-box}.w0{display:block;width:100%}
input.f{width:100%;box-sizing:border-box;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);margin:6px 0}
.sq{width:calc(100% - 32px);margin:8px 16px}
.chips{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto}
.fc{padding:6px 14px;border-radius:20px;border:1px solid var(--ln);white-space:nowrap;background:var(--sf)}.fc.on{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}
.fab{position:absolute;right:18px;bottom:70px;width:56px;height:56px;border-radius:18px;background:var(--ac);color:var(--on);font-size:28px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.cinfo{text-align:center;padding:8px 0 6px;border-bottom:1px solid var(--ln)}.cinfo .av{margin:0 auto}.cinfo small{display:block;color:var(--mu);margin-top:4px;min-height:16px}
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;padding:8px 12px;border-radius:var(--br,16px);font-size:var(--fs,16px);background:var(--th);align-self:flex-start;text-align:left;word-break:break-word}
.b.me{background:color-mix(in srgb,var(--ac) 28%,var(--bg));align-self:flex-end}.b small{display:block;text-align:right;color:var(--mu);font-size:11px}
.tk{margin-left:4px}.tk.seen{color:var(--ok)}
.cb{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--ln);background:var(--sf);align-items:center}
.cb input{flex:1;min-width:0;padding:10px 14px;border-radius:22px;border:1px solid var(--ln);background:var(--bg)}
.ov{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;overflow-y:auto}
.ov .f{max-width:340px}.ov .pb{max-width:340px}
.seg{display:flex;border:1px solid var(--ln);border-radius:12px;overflow:hidden;width:100%;max-width:340px}.seg button{flex:1;padding:10px}.seg .on{background:var(--ac);color:var(--on);font-weight:700}
.err{color:#D33;min-height:20px;margin:0;font-size:14px}.mu{color:var(--mu);font-size:14px;margin:4px 0}.pad{padding:0 16px}.empty{padding:24px;text-align:center;color:var(--mu)}
.lnk{color:var(--ac);text-decoration:underline}.center{text-align:center;padding:20px 0 4px}.center .av{margin:0 auto 8px}
.row2{display:flex;justify-content:space-between;align-items:center}
.sw{width:46px;height:26px;border-radius:13px;background:var(--th);position:relative;border:1px solid var(--ln)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.2s}
.sw.on{background:var(--ac)}.sw.on::after{left:22px;background:var(--on)}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:6}
.sh{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--sf);border-top:1px solid var(--ln);border-radius:18px 18px 0 0;padding:14px 16px 22px;text-align:center}
.sh button{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--ln)}.sh .av{margin:0 auto 8px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;transition:.2s;z-index:9;max-width:90%;text-align:center;pointer-events:none}
h1,h2{margin:0}.sysm{align-self:center;color:var(--mu);font-size:12px;background:var(--th);border-radius:10px;padding:2px 10px}.ban{background:var(--me);text-align:center;font-size:13px;padding:4px}.ban:empty{display:none}.nav button{font-size:11.5px;padding:12px 2px}

/* luxury soft */
*{-webkit-tap-highlight-color:transparent}button,input{touch-action:manipulation}
:root{--r:20px;--sh:0 8px 22px rgba(0,0,0,.22)}
html,body{background:radial-gradient(900px 520px at 50% -8%,color-mix(in srgb,var(--ac) 11%,var(--bg)),var(--bg)) fixed}
#app{background:transparent;height:100%;height:100dvh}
.hd{background:transparent;border-bottom:0;padding:16px 18px 8px}
.hd .t,.logo{font-family:Georgia,'Times New Roman',serif;letter-spacing:.05em}.hd .t{font-size:20px}
.body,#msgs{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.body{padding-bottom:88px}
#list .row{margin:7px 12px;width:calc(100% - 24px);box-sizing:border-box;border:1px solid var(--ln);border-radius:var(--r);background:var(--sf);box-shadow:var(--sh);padding:12px 14px}
.card{border-radius:var(--r);box-shadow:var(--sh)}
.av{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px color-mix(in srgb,var(--ac) 65%,transparent)}
.nav{position:absolute;left:14px;right:14px;bottom:12px;border:1px solid var(--ln);border-radius:28px;background:color-mix(in srgb,var(--sf) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--sh);padding:5px;gap:2px}
.nav button{border-radius:22px;padding:10px 2px}.nav .on{background:color-mix(in srgb,var(--ac) 20%,transparent)}
.fab{bottom:96px;border-radius:50%;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#fff))}
.b{border-radius:calc(var(--br,16px) + 4px);box-shadow:0 2px 8px rgba(0,0,0,.16);background:color-mix(in srgb,var(--sf) 88%,var(--ac))}
.b.me{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 40%,var(--bg)),color-mix(in srgb,var(--ac) 22%,var(--bg)))}
.cb{border-top:0;background:transparent;padding:10px 12px}.cb input{background:var(--sf);box-shadow:var(--sh)}
.cinfo{border-bottom:0}.sh{border-radius:26px 26px 0 0}
.fc{background:var(--sf)}.fc.on{box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 35%,transparent)}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.pg>*{animation:fi .22s ease both}
</style></head><body>

 const lk=S.locked&&S.me;const V={splash:splashV,agree:agreeV,auth:authV,home:homeV,chat:chatV,set:setV,upd:updV,com:comV,lockl:lockedV,decoy:decoyV,fun:funV,uname:unameV}[S.scr]||homeV;
 const pgc=S.scr!==lastScr;lastScr=S.scr;$('#app').innerHTML=lk?lockV():V()+(S.sheet?sheetV():'');$('#app').className=pgc?'pg':'';
 for(const id in keep){const e=$('#'+id);if(e){e.value=keep[id][0];if(keep[id][1])e.focus()}}

function chatsSnap(snap){const me=S.me.uid;S.chats=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
 S.chats.forEach(c=>{c.members.forEach(loadUser);const m=c.lastMsg;
  if(m&&m.from!==me){
   if(!c.group&&((S.my&&S.my.blocked)||[]).includes(otherOf(c))){lastUpd[c.id]=c.updatedAt;return}
   if((c.updatedAt||0)>((c.deliv||{})[me]||0)&&delivDone[c.id]!==c.updatedAt){delivDone[c.id]=c.updatedAt;updateDoc(doc(db,'chats',c.id),{['deliv.'+me]:Math.max(Date.now(),c.updatedAt)}).catch(()=>{})}
   if((loaded||lastUpd[c.id]!==undefined)&&lastUpd[c.id]!==c.updatedAt&&!(S.scr==='chat'&&S.cid===c.id)&&!S.mute[c.id]){toast(S.locks[c.id]?'New message':(c.group?c.name:((S.U[otherOf(c)]||{}).name||'New message'))+': '+m.t);beep()}}
  lastUpd[c.id]=c.updatedAt});
 loaded=true;upList();if(S.scr==='chat'){upMsgs();markSeen()}}

async function send(){const i=$('#inp');if(!i)return;const t=i.value.trim();if(!t)return;if(((S.my&&S.my.blocked)||[]).includes(S.other))return toast('Unblock this user to send messages');{const g0=S.chats.find(c=>c.id===S.cid);if(g0&&g0.group&&g0.sendAdmins&&!gAdmins(g0).includes(S.me.uid))return toast('Only admins can send messages')}i.value='';const me=S.me.uid,ref=doc(db,'chats',S.cid),now=Date.now(),ch=S.chats.find(c=>c.id===S.cid),others=ch?ch.members.filter(x=>x!==me):[S.other],un={},vn=(ch&&ch.vanish)||0;others.forEach(x=>un[x]=increment(1));

function shrink(file,sz=96){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d'),s=Math.min(img.width,img.height);x.drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,sz,sz);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};img.onerror=rej;img.src=u})}

pick:v=>{const[k,x]=v.split(':');S[k]=x;if(k==='tone'){ls('cloq_tone',x);tone(x)}if(k==='vib'){ls('cloq_vib',x);vibr()}render()},
csearch:()=>{S.csOn=!S.csOn;S.cs='';S.sheet=null;render();const e=$('#cs');if(e)e.focus()},
vanish:()=>{if(!S.chats.some(c=>c.id===S.cid)){S.sheet=null;toast('Send a message first');return render()}S.sheet='vanish';render()},
vset:async v=>{S.sheet=null;render();try{await updateDoc(doc(db,'chats',S.cid),{vanish:+v});toast(+v?'Disappearing messages on':'Disappearing messages off')}catch(e){toast('Could not change ('+(e.code||e.message)+')')}},
wallp:()=>{S.sheet='wall';render()},
wset:v=>{if(v)S.wall[S.cid]=v;else delete S.wall[S.cid];ls('cloq_wall',JSON.stringify(S.wall));S.sheet=null;render()},
cclear:()=>{S.clr[S.cid]=Date.now();ls('cloq_clr',JSON.stringify(S.clr));S.sheet=null;toast('Chat cleared on this phone');render()},
block:()=>{S.sheet='block';render()},
doblock:async()=>{S.sheet=null;await upd({blocked:arrayUnion(S.other)},'Blocked');A.back()},
report:()=>{S.sheet='report';render()},
dorep:async v=>{S.sheet=null;render();try{await addDoc(collection(db,'reports'),{by:S.me.uid,target:S.other||'',chat:S.cid,reason:v,at:Date.now()});toast('Report sent. Thank you')}catch(e){toast('Could not send report')}},
leave:async()=>{S.sheet=null;try{await updateDoc(doc(db,'chats',S.cid),{members:arrayRemove(S.me.uid)});toast('You left the group');A.back()}catch(e){toast('Could not leave ('+(e.code||e.message)+')')}},
fun:()=>{S.sheet=null;S.scr='fun';S.fun=null;render()},
fcall:()=>{S.fun='callsetup';S.fn='Fun Friend';render()},
fchat:()=>{S.fun='chatsetup';S.fn='Fun Friend';render()},
fstart:()=>{const n=($('#fn').value||'').trim();if(!n)return toast('Enter a name');if(S.chats.some(c=>c.group?c.name.toLowerCase()===n.toLowerCase():((S.U[otherOf(c)]||{}).name||'').toLowerCase()===n.toLowerCase())||/cloq/i.test(n))return toast('Use an imaginary name, not a real contact');S.fn=n;S.fm=[];S.fa=false;S.ft=0;if(S.fun==='callsetup'){S.fun='call';tone('Classic',.25);vibr();clearInterval(S.ring);S.ring=setInterval(()=>{if(S.fun!=='call'||S.fa)return clearInterval(S.ring);tone('Classic',.25);vibr()},1600)}else S.fun='chat';render()},
facc:()=>{S.fa=true;clearInterval(S.timer);S.timer=setInterval(()=>{if(S.fun!=='call')return clearInterval(S.timer);S.ft++;render()},1000);render()},
fdec:()=>{clearInterval(S.ring);clearInterval(S.timer);S.fun=null;render()},
fadd:v=>{const i=$('#fl');if(!i||!i.value.trim())return;S.fm.push({me:v==='me',t:i.value.trim()});render()},
newcom:()=>{S.sheet='ccom';S.cg=[];S.cn='';S.sm='';render()},
cgt:v=>{S.cn=($('#cn')||{}).value||'';S.cg=S.cg.includes(v)?S.cg.filter(x=>x!==v):[...S.cg,v];render()},
ccreate:async()=>{const n=($('#cn').value||'').trim();S.cn=n;if(!n){S.sm='Enter a community name';return render()}const gs=S.chats.filter(c=>c.group&&S.cg.includes(c.id));if(!gs.length){S.sm='Choose at least one group';return render()}const me=S.me.uid;
 try{await addDoc(collection(db,'communities'),{name:n,desc:(($('#cd')||{}).value||'').trim().slice(0,120),admin:me,members:[...new Set([me,...gs.flatMap(g=>g.members)])],groups:gs.map(g=>({id:g.id,name:g.name})),createdAt:Date.now()});S.sheet=null;toast('Community created');render()}catch(e){S.sm='Could not create ('+(e.code||e.message)+')';render()}},
gopen:v=>{if(S.chats.some(c=>c.id===v)){S.fromLock=false;openChat(v,'')}else toast('You are not in this group')},
contact:()=>{const gc=S.chats.find(x=>x.id===S.cid);if(gc&&gc.group){S.sheet=null;S.scr='ginfo'}else S.sheet='contact';render()},
gpic:()=>{S.pfTarget='group';$('#pf').click()},
gsearch:()=>{S.csOn=true;S.cs='';S.scr='chat';render();const e=$('#cs');if(e)e.focus()},
gsave:async()=>{const c=S.chats.find(x=>x.id===S.cid),n=($('#gname').value||'').trim(),d=($('#gdesc').value||'').trim();if(!n)return toast('Enter a group name');try{await updateDoc(doc(db,'chats',S.cid),{name:n,desc:d});if(c&&c.name!==n)sysmsg((S.my.name||'Someone')+' changed the group name to '+n);toast('Saved')}catch(e){toast('Could not save ('+(e.code||e.message)+')')}},
gtog:async v=>{const c=S.chats.find(x=>x.id===S.cid);if(!c)return;try{await updateDoc(doc(db,'chats',S.cid),{[v]:!c[v],admins:gAdmins(c)})}catch(e){toast('Could not change ('+(e.code||e.message)+')')}},
gmk:async v=>{const c=S.chats.find(x=>x.id===S.cid);if(!c)return;const ia=gAdmins(c).includes(v);try{await updateDoc(doc(db,'chats',S.cid),{admins:ia?arrayRemove(v):arrayUnion(v)});sysmsg(((S.U[v]||{}).name||'A member')+(ia?' is no longer an admin':' is now an admin'))}catch(e){toast('Could not change ('+(e.code||e.message)+')')}},
grm:async v=>{try{await updateDoc(doc(db,'chats',S.cid),{members:arrayRemove(v),admins:arrayRemove(v)});sysmsg(((S.U[v]||{}).name||'A member')+' was removed')}catch(e){toast('Could not remove ('+(e.code||e.message)+')')}},
gmember:()=>{S.sheet='gm2';S.sm='';render()},
gaddm:async()=>{const e=($('#gem').value||'').trim().toLowerCase(),c=S.chats.find(x=>x.id===S.cid);if(!e||!c)return;try{const q=await getDocs(query(collection(db,'users'),where('email','==',e),limit(1)));if(q.empty){S.sm='No CLOQ user with this email';return render()}const d=q.docs[0];if(c.members.includes(d.id)){S.sm='Already in the group';return render()}S.U[d.id]={...d.data(),uid:d.id};await updateDoc(doc(db,'chats',S.cid),{members:arrayUnion(d.id)});sysmsg((S.my.name||'Someone')+' added '+d.data().name);S.sheet=null;toast('Member added');render()}catch(x){S.sm='Could not add ('+(x.code||x.message)+')';render()}},
leave:async()=>{S.sheet=null;const nm=(S.my&&S.my.name)||'Someone';try{await sysmsg(nm+' left');await updateDoc(doc(db,'chats',S.cid),{members:arrayRemove(S.me.uid),admins:arrayRemove(S.me.uid)});toast('You left the group');S.scr='chat';A.back()}catch(e){toast('Could not leave ('+(e.code||e.message)+')')}},
cadd:v=>{S.ccid=v;S.cg=[];S.sheet='cadd';render()},
cadd2:async()=>{const gs=S.chats.filter(c=>c.group&&S.cg.includes(c.id));if(!gs.length)return toast('Choose a group');try{await updateDoc(doc(db,'communities',S.ccid),{groups:arrayUnion(...gs.map(g=>({id:g.id,name:g.name}))),members:arrayUnion(...new Set(gs.flatMap(g=>g.members)))});S.sheet=null;toast('Added');render()}catch(e){toast('Could not add ('+(e.code||e.message)+')')}},
cdel:async v=>{try{await deleteDoc(doc(db,'communities',v));toast('Community deleted')}catch(e){toast('Could not delete')}},
gsend:async()=>{const gc=S.chats.find(x=>x.id===S.cid);try{await updateDoc(doc(db,'chats',S.cid),{sendAdmins:!gc.sendAdmins});toast(gc.sendAdmins?'Everyone can send':'Only admins can send')}catch(e){toast('Could not change')}},
gren:async()=>{const n=($('#gen').value||'').trim();if(!n)return;try{await updateDoc(doc(db,'chats',S.cid),{name:n});S.sm='';toast('Group renamed');render()}catch(e){S.sm='Could not rename';render()}},
gaddm:async()=>{const e=($('#gae').value||'').trim().toLowerCase();if(!e)return;const gc=S.chats.find(x=>x.id===S.cid);try{const q=await getDocs(query(collection(db,'users'),where('email','==',e),limit(1)));if(q.empty){S.sm='No CLOQ user with this email';return render()}const d=q.docs[0];if(gc.members.includes(d.id)){S.sm='Already in the group';return render()}await updateDoc(doc(db,'chats',S.cid),{members:arrayUnion(d.id)});S.U[d.id]={...d.data(),uid:d.id};S.sm='';toast('Member added');render()}catch(x){S.sm='Could not add ('+(x.code||x.message)+')';render()}},
gkick:async v=>{try{await updateDoc(doc(db,'chats',S.cid),{members:arrayRemove(v),admins:arrayRemove(v)});toast('Member removed')}catch(e){toast('Could not remove')}},
gmk:async v=>{const gc=S.chats.find(x=>x.id===S.cid),ad=gc.admins||[gc.admin];try{await updateDoc(doc(db,'chats',S.cid),{admins:ad.includes(v)?ad.filter(x=>x!==v):[...ad,v]})}catch(e){toast('Could not change admin')}},
find:async()=>{const t=($('#fe').value||'').trim();if(!t)return;try{const u=await findUser(t);if(!u){S.sm='No CLOQ user found. Check the username.';return render()}if(u.uid===S.me.uid){S.sm='That is you';return render()}S.U[u.uid]=u;S.sheet=null;openChat(cidOf(S.me.uid,u.uid),u.uid)}catch(x){S.sm='Search failed ('+(x.code||x.message)+')';render()}},
gadd:async()=>{S.gname=$('#gn').value;const t=($('#ge').value||'').trim();if(!t)return;try{const u=await findUser(t);if(!u){S.sm='No CLOQ user found';return render()}if(u.uid===S.me.uid){S.sm='That is you';return render()}if(S.gm.some(m=>m.uid===u.uid)){S.sm='Already added';return render()}S.U[u.uid]=u;S.gm.push({uid:u.uid,name:u.name});S.sm='';$('#ge').value='';render()}catch(x){S.sm='Search failed ('+(x.code||x.message)+')';render()}},
gaddm:async()=>{const t=(($('#gae')||$('#gem')||{}).value||'').trim();if(!t)return;const gc=S.chats.find(x=>x.id===S.cid);try{const u=await findUser(t);if(!u){S.sm='No CLOQ user found';return render()}if(gc.members.includes(u.uid)){S.sm='Already in the group';return render()}await updateDoc(doc(db,'chats',S.cid),{members:arrayUnion(u.uid)});S.U[u.uid]=u;S.sm='';toast('Member added');render()}catch(x){S.sm='Could not add ('+(x.code||x.message)+')';render()}},
saveuname:async()=>{const un=normU($('#uu').value);S.f.uu=un;S.err='';if(!/^[a-z0-9_]{3,20}$/.test(un)){S.err='Use 3-20 letters, numbers or _';return render()}const old=S.my&&S.my.username;if(un===old)return toast('That is already your username');
 try{const e=await getDoc(doc(db,'usernames',un));if(e.exists()){S.err='That username is taken';return render()}const b=writeBatch(db);b.set(doc(db,'usernames',un),{uid:S.me.uid});b.update(doc(db,'users',S.me.uid),{username:un});if(old)b.delete(doc(db,'usernames',old));await b.commit();S.err='';toast('Username saved');if(S.scr==='uname')S.scr='home';render()}catch(x){S.err='Could not save ('+(x.code||x.message)+')';render()}},
rmlive:async()=>{try{await deleteDoc(doc(db,'livedp',S.me.uid));delete S.LV[S.me.uid];await upd({live:false},'Live DP removed')}catch(e){toast('Could not remove')}},
logout:async()=>{presence(false);try{await signOut(auth)}catch(e){}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='inp')send();if(e.target.id==='fe')A.find();if(e.target.id==='lk')A.unlock();if(e.target.id==='lp')A.lpw();if(e.target.id==='dinp')A.dsend()}});
document.addEventListener('input',e=>{if(e.target.id==='cs'){S.cs=e.target.value;upMsgs()}if(e.target.id==='sq'){S.q=e.target.value;upList()}});
$('#pf').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if((f.type||'').startsWith('video/')&&S.pfTarget!=='group'){toast('Making your Live DP…');const L=await makeLive(f);if(L.frames.join('').length>900000)throw new Error('big');await setDoc(doc(db,'livedp',S.me.uid),{frames:L.frames,fps:L.fps,dur:L.dur,at:Date.now()});L._at=0;S.LV[S.me.uid]=L;await upd({photo:L.frames[0],live:true,liveAt:Date.now()},L.over?'Live DP set (first 10 seconds)':'Live DP set');S.pfTarget='';return}const d=await shrink(f);if(S.pfTarget==='group'){await updateDoc(doc(db,'chats',S.cid),{photo:d});toast('Group photo updated')}else await upd({photo:d,live:false},'DP updated');S.pfTarget=''}catch(x){toast('Could not read this photo')}});

onAuthStateChanged(auth,async u=>{
 unsubs.forEach(f=>f());unsubs=[];loaded=false;
 if(!u){S.me=null;S.my=null;S.chats=[];S.ready=true;route();return}
 S.me=u;if(!signing){try{await ensureUser(u)}catch(e){toast('Profile error ('+(e.code||e.message)+')')}}
 unsubs.push(onSnapshot(doc(db,'users',u.uid),s=>{S.my={...(s.data()||{}),uid:u.uid};S.U[u.uid]=S.my;(S.my.blocked||[]).forEach(loadUser);if(S.my.live)loadLive(u.uid,S.my.liveAt);if(S.my.username&&S.scr==='uname'){S.scr='home';render()}else if(s.exists()&&!S.my.username&&S.ready&&S.splash&&['home','chat','set','upd','com'].includes(S.scr)){S.scr='uname';render()}else if(S.scr==='set')render()},()=>{}));
 unsubs.push(onSnapshot(query(collection(db,'chats'),where('members','array-contains',u.uid)),chatsSnap,e=>toast('Chats error: '+e.code)));
 unsubs.push(onSnapshot(query(collection(db,'statuses'),where('at','>',Date.now()-86400000),orderBy('at','desc')),sn=>{S.sts=sn.docs.map(d=>({id:d.id,...d.data()}));S.sts.forEach(x=>loadUser(x.uid));if(S.scr==='upd')render()},()=>{}));
 unsubs.push(onSnapshot(query(collection(db,'communities'),where('members','array-contains',u.uid)),sn=>{S.coms=sn.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));if(S.scr==='com')render()},()=>{}));
 presence(true);S.ready=true;route()});
applyTheme();render();setTimeout(()=>{S.splash=true;route()},1100);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
