        if(d.chat && d.chat !== curChat) return;
        var div = document.createElement("div");
        div.className = "b";
        div.innerHTML = d.text + "<small>" + (d.sender || "Dost") + " • " + (d.time || "") + "</small>";
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      });
    });

    // ===== REAL SEND - Firebase me save karo =====
    window.sendToFirebase = async function(text){
      try{
        await addDoc(collection(db, "chats"), {
          text: text,
          sender: "Waqas",
          uid: user.uid,
          chat: curChat,
          time: new Date().toLocaleTimeString(),
          createdAt: serverTimestamp()
        });
        console.log("Sent to Firebase:", text);
      }catch(e){ console.log("Send Error:", e.message); toast("Send me masla: " + e.message); }
    };

    // Purana sendMsg ko REAL karo - Local + Firebase dono
    var oldSend = window.sendMsg;
    window.sendMsg = function(){
      var ti = document.getElementById("ti");
      if(!ti) return;
      var t = ti.value.trim();
      if(!t) return;
      if(window.sendToFirebase) window.sendToFirebase(t);
      if(oldSend) oldSend();
    };
  });
}catch(e){
  console.log("Firebase Error:", e.message);
  toast("Firebase Error: " + e.message);
}
</script></body></html>
